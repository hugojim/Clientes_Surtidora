
<mat-card style="width:70%;margin:50px auto">
    <mat-card-header>
        <mat-card-title>Administración de Clientes</mat-card-title>
    </mat-card-header>
  <mat-card-content>
    <button mat-flat-button color="primary" (click)="nuevo()">  <mat-icon>add</mat-icon>Nuevo cliente</button>
  </mat-card-content>
</mat-card>


<table mat-table [dataSource]="clientes" class="mat-elevation-z2" style="margin: top 20px;">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
    <ng-container matColumnDef="ClienteId">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.clienteId}} </td>
  </ng-container>

  <ng-container matColumnDef="Nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let element"> {{element.nombreCompleto}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="Correo">
    <th mat-header-cell *matHeaderCellDef> Correo </th>
    <td mat-cell *matCellDef="let element"> {{element.correoElectronico}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="Telefono">
    <th mat-header-cell *matHeaderCellDef> Telefono </th>
    <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="Accion">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element"> 
         <button mat-icon-button color="primary" (click)="editar(element)">
        <mat-icon>edit</mat-icon>
      </button>
       <button mat-icon-button color="warm" (click)="eliminar(element)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
